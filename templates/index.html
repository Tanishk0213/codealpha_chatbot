<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <!-- Markdown & Sanitization libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <!-- Top Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar bot-avatar-header">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"></path>
            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
            <path d="M2 14h2"></path>
            <path d="M20 14h2"></path>
            <path d="M15 13v2"></path>
            <path d="M9 13v2"></path>
          </svg>
          <span class="status-indicator online" id="statusDot" title="Checking server status..."></span>
        </div>
        <div class="header-info">
          <div class="header-title-row">
            <h1 class="chat-title">AI Assistant</h1>
            <span class="badge-tag">v2.0</span>
          </div>
          <p class="chat-subtitle" id="statusText">Dual-Engine • Ready</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <!-- Export Chat -->
        <button class="icon-btn" id="exportBtn" title="Export Conversation (.txt)" aria-label="Export Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>

        <!-- Clear Chat -->
        <button class="icon-btn" id="clearBtn" title="Clear Conversation" aria-label="Clear Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main class="chat-window" id="chatWindow">
      <!-- Welcome Hero Card -->
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
          </svg>
          <span>AI Assistant</span>
        </div>
        <h2 class="welcome-title">How can I help you today?</h2>
        <p class="welcome-desc">
          Ask me anything — general questions, coding help, writing, or brainstorming.
        </p>

        <!-- Quick Suggestion Chips -->
        <div class="suggestions-grid">
          <button class="suggestion-chip" data-prompt="What can you help me with?">
            <span class="chip-icon">💡</span>
            <span class="chip-text">What can you do?</span>
          </button>
          <button class="suggestion-chip" data-prompt="Help me debug a piece of code">
            <span class="chip-icon">💻</span>
            <span class="chip-text">Help with code</span>
          </button>
          <button class="suggestion-chip" data-prompt="Give me some writing tips for a blog post">
            <span class="chip-icon">✍️</span>
            <span class="chip-text">Writing help</span>
          </button>
          <button class="suggestion-chip" data-prompt="Explain a concept to me in simple terms">
            <span class="chip-icon">📚</span>
            <span class="chip-text">Explain something</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="chat-footer">
      <form class="chat-input-wrapper" id="chatForm" onsubmit="return false;">
        <!-- Voice Input Button -->
        <button type="button" class="tool-btn" id="micBtn" title="Speak message (Voice Recognition)" aria-label="Voice Input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>

        <!-- Auto-expanding input textarea -->
        <textarea
          id="chatInput"
          placeholder="Ask a question or select a topic above..."
          rows="1"
          maxlength="500"
          autocomplete="off"
        ></textarea>

        <!-- Character count indicator -->
        <span class="char-counter" id="charCounter">0/500</span>

        <!-- Send Button -->
        <button type="submit" class="send-btn" id="sendBtn" title="Send message (Enter)" aria-label="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="footer-note">
        <span>Fast Regex FAQ + Generative AI • MongoDB Atlas Cloud DB</span>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
